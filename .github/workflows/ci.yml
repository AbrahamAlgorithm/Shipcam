name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run. Runs on main are never
# cancelled, so every commit in main's history gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shipcamkit:
    name: ShipcamKit · build and test
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Packages/ShipcamKit
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The import check fails the build when a module imports another module it
      # hasn't declared as a dependency, so pure modules can't reach platform ones.
      - name: Build all modules
        run: swift build --explicit-target-dependency-import-check error

      - name: Run tests
        run: swift test --explicit-target-dependency-import-check error

  lint:
    name: Lint · swift-format and SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    env:
      # Same version as local development. Update both values together.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@v7

      # The runner image doesn't include SwiftLint. Download the pinned release and
      # refuse to run it unless its checksum matches.
      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          swift format --version
          swiftlint version

      - name: Lint
        run: scripts/lint.sh

      # `swift format lint` misses some changes the formatter would make (such as the
      # blank line before @testable imports), so run the formatter and fail on any diff.
      - name: Check formatting
        run: |
          scripts/format.sh
          git diff --exit-code
